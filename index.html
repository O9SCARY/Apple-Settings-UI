<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Settings</title>
    <link rel="stylesheet" href="styles.css"
</head>
<body>
    <div class="sidebar">
        <input type="search" placeholder="Search" id="search-bar">
        <div class="apple-acc">
            <div class="name">

                <img src="images/account_circle_40dp_B7B7B7_FILL1_wght400_GRAD0_opsz40.svg">
                <div class="user-info">
                    <p id="apple-acc-name">Sign into Your iPhone</p>
                    <p id="setup">Set up iCloud, App Store and more.</p>
                </div>
                
            </div>
            <img src="./images/arrow_forward_ios_40dp_B7B7B7_FILL0_wght400_GRAD0_opsz40.svg" height="16px">
        </div>
        <div class="options">
            <div class="connectivity-and-battery">
                <div class="wifi"></div>
                <div class="bluetooth"></div>
                <div class="network"></div>
                <div class="battery"></div>
            </div>
            <div class="general-and-accesibility">
                <div class="General"></div>
                <div class="accessibility"></div>
                <div class="appearance"></div>
                <div class="control-center"></div>
                <div class="siri"></div>
                <div class="privacy"></div>
            </div>
            <div class="desktop">
                <div class="desktop"></div>
                <div class="display"></div>
                <div class="wallpaper"></div>
                <div class="screen-saver"></div>
            </div>
            <div class="sound-notifications">
                <div class="notifications"></div>
                <div class="sound"></div>
                <div class="focus"></div>
            </div>
            
        </div>
    </div>

    <div class="right-panel">

    </div>

    <script src="script.js"></script>
</body>
</html>
