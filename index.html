<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Settings</title>
    <link rel="stylesheet" href="styles.css"
</head>
<body>
    <div class="sidebar">
        <input type="search" placeholder="Search" id="search-bar">
        <div class="apple-acc">
            <div class="name">

                <img src="images/account_circle_40dp_B7B7B7_FILL1_wght400_GRAD0_opsz40.svg">
                <div class="user-info">
                    <p id="apple-acc-name">Sign into Your MacBook</p>
                    <p class="smaller-text">Set up iCloud, App Store and more.</p>
                </div>
                
            </div>
            <img src="./images/arrow_forward_ios_40dp_B7B7B7_FILL0_wght400_GRAD0_opsz40.svg" height="16px">
        </div>
        <div class="options">
            <div class="connectivity-and-battery">
                <div class="wifi">
                    <div class="icons" id="wifi">                        
                        <img src="./images/wifi_24dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.svg" width="22px">
                    </div>
                    <div class="sec-wifi">

                        <p>Wi-Fi</p>
                        <p class="smaller-text">Off</p>
                    </div>
                </div>
                <div class="bluetooth">
                    <div class="icons" id="bluetooth">                        
                        <img src="./images/bluetooth_24dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.svg" width="22px">
                    </div>
                    <div class="bluetooth-sec">
                        <p>Bluetooth</p>
                        <p class="smaller-text">On</p>
                    </div>
                </div>
                <div class="network">
                    <div class="icons" id="network">
                        <img src="./images/language_24dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.svg" width="22px">
                    </div>
                    <p>Network</p>
                </div>
                <div class="battery">
                    <div class="icons" id="battery">
                        <img src="./images/battery_android_5_22dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.svg">
                    </div>
                    <p>Battery</p>
                </div>
            </div>
            <div class="general-and-accessibility">
                <div class="general">
                    <div class="icons" id="general">
                        <img src="./images/light_mode_22dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.svg" width="22px">
                    </div>
                    <p>General</p>

                </div>
                <div class="accessibility">
                    <div class="icons" id="accessibility">
                        <img src="./images/settings_accessibility_22dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.svg" width="22px">
                    </div>
                    <p>Accessibility</p>
                </div>
                <div class="appearance">
                    <div class="icons" id="appearance">
                        <img src="./images/contrast_22dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.svg" width="22px">
                    </div>
                    <p>Appearance</p>
                </div>
                <div class="control-center">
                    <div class="icons" id="control-center">
                        <img src="./images/tune_24dp_E3E3E3.svg" width="22px">
                    </div>
                    <p>Control Center</p>
                </div>
                <div class="siri">
                    <div class="icons" id="siri">
                        <img src="./images/auto_awesome_24dp_FFFFFF.svg" width="22px">
                    </div>
                    <p>Siri & Spotlight</p>
                </div>
                <div class="privacy">
                    <div class="icons" id="privacy">
                        <img src="./images/gpp_good_24dp_FFFFFF.svg" width="22px">
                    </div>
                    <p>Privacy And Security</p>
                </div>
            </div>
            <div class="desktop-and-display">
                <div class="desktop">
                    <div class="icons" id="desktop">
                        <img src="./images/desktop_mac_22dp_FFFFFF.svg" width="22px">
                    </div>
                    <p>Desktop & Dock</p>
                </div>
                <div class="display">
                    <div class="icons" id="desktop">
                        <img src="./images/desktop_mac_22dp_FFFFFF.svg" width="22px">
                    </div>
                    <p>Displays</p>
                </div>
                <div class="wallpaper">
                    <div class="icons" id="wallpaper">
                        <img src="./images/wallpaper_22dp_FFFFFF.svg">
                    </div>
                    <p>Wallpaper</p>
                </div>
                <div class="screen-saver">
                    <div class="icons" id="screen-saver">
                        <img src="./images/bedtime_22dp_FFFFFF.svg" width="22px">
                    </div>
                    <p>Screen Saver</p>
                </div>
            </div>
            <div class="sound-notifications">
                <div class="notifications">
                    <div class="icons" id="notifications">
                        <img src="./images/notifications_active_22dp_FFFFFF.svg" width="22px">
                    </div>                    
                    <p>Notifications</p>
                </div>
                <div class="sound">
                    <div class="icons" id="sound">
                        <img src="./images/volume_up_22dp_FFFFFF.svg" width="22px">
                    </div>                    
                    <p>Sound</p>
                </div>
                <div class="focus">
                    <div class="icons" id="focus">
                        <img src="./images/do_not_disturb_on_total_silence_22dp_FFFFFF.svg" width="22px">
                    </div>
                    <p>Focus</p>
                </div>
            </div>
            
        </div>
    </div>

    <div class="right-panel">
        <div class="topname-bar">
            <div class="gen-arrows">
                <img src="./images/arrow_forward_ios_40dp_B7B7B7_FILL0_wght400_GRAD0_opsz40.svg" width="22px" style="transform: rotate(180deg);" class="gen-arrows">
                <img src="./images/arrow_forward_ios_40dp_B7B7B7_FILL0_wght400_GRAD0_opsz40.svg" width="22px" class="gen-arrows">
            </div>
            <h2 id="topname-bar">General</h2>
            <div></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
